name: Actualizar directorio para buscadores

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-search-directory
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Leer negocios publicados y actualizar archivos
        run: node scripts/generate-search-pages.mjs
      - name: Publicar cambios si hay nuevas fichas
        run: |
          if git diff --quiet -- public/directorio/index.html public/sitemap.xml public/guide-data.json; then
            echo "El directorio ya está actualizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/directorio/index.html public/sitemap.xml public/guide-data.json
          git commit -m "Actualizar directorio y sitemap de negocios publicados"
          git push
