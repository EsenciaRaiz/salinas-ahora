name: Aplicar mejora de búsqueda

on:
  push:
    branches:
      - mejora-busqueda-palabras-clave
    paths:
      - scripts/apply-keyword-search-improvement.mjs
      - .github/workflows/apply-keyword-search-improvement.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mejora-busqueda-palabras-clave
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar y validar cambios de búsqueda
        run: node scripts/apply-keyword-search-improvement.mjs
      - name: Guardar cambios
        run: |
          if git diff --quiet -- app/page.tsx public/publicar/index.html; then
            echo "No hay cambios pendientes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx public/publicar/index.html
          git commit -m "Mejorar búsqueda por oficios y palabras clave"
          git push
