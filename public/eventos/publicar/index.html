<!doctype html><html lang="es-UY"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proponer un evento | Vitrina Cerca</title><meta name="robots" content="noindex,follow"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/eventos/eventos.css?v=imagenes-2"></head><body><main><nav><a class="brand" href="/">VITRINA <strong>CERCA</strong></a><a href="/eventos/">Ver cartelera</a></nav><h1>Compartí tu evento</h1><p class="intro">Publicar en la cartelera es gratuito por el momento, tanto para actividades gratuitas como con entrada paga. Completá los datos y Mónica los revisará antes de publicarlos. Al finalizar, el evento dejará de aparecer automáticamente.</p><form id="form"><label class="full">Título *<input name="titulo" required maxlength="100"></label><label class="full">Descripción breve *<textarea name="descripcion" required maxlength="700"></textarea></label><label>Localidad *<input name="localidad" required maxlength="80" placeholder="Ej.: Salinas"></label><label>Lugar *<input name="lugar" required maxlength="120"></label><label class="full">Dirección pública *<input name="direccion" required maxlength="160"></label><label>Inicio *<input name="inicio" type="datetime-local" required><span class="small">Fecha y hora de Uruguay.</span></label><label>Finalización *<input name="fin" type="datetime-local" required><span class="small">Si dura varios días, indicá la última fecha.</span></label><label>Entrada *<select name="entrada" required><option value="Gratis">Gratis</option><option value="Paga">Paga</option></select></label><label id="price" hidden>Costo de la entrada *<input name="precio" maxlength="100" placeholder="Ej.: $250 uruguayos"></label><label>Organizador *<input name="organizador" required maxlength="100"></label><label>Teléfono público *<input name="telefono" type="tel" required maxlength="20" placeholder="59899123456"></label><label class="check"><input type="checkbox" name="whatsapp" value="si"><span>Este número recibe consultas por WhatsApp. Mostrar el botón en el evento.</span></label><label class="full">Enlace para consultar o reservar<input name="enlace" type="url" maxlength="1000" placeholder="https://"></label><label class="full">Foto o cartel del evento (opcional)<input name="imagen_archivo" type="file" accept="image/*"><span class="small">Elegí una imagen de tu celular. Se reduce antes de enviarla para que la cartelera siga cargando rápido.</span></label><label class="full">O enlace público a la imagen<input name="imagen_url" type="url" maxlength="1000" placeholder="https://"><span class="small">También aceptamos enlaces compartidos de Google Drive. El archivo debe estar configurado como «Cualquier persona con el enlace puede verlo». Elegí foto o enlace, no ambos.</span></label><label class="full">Correo de contacto privado *<input name="correo" type="email" required maxlength="120"><span class="small">Solo para gestionar tu solicitud; no se publica.</span></label><label class="check full"><input type="checkbox" name="consentimiento" value="si" required><span>Confirmo que los datos son correctos y tengo autorización para publicar el contenido. Leí el <a href="/privacidad/" target="_blank" rel="noopener">aviso de privacidad</a> y autorizo el uso del correo para gestionar esta solicitud.</span></label><input name="website" tabindex="-1" autocomplete="off" aria-hidden="true" class="honeypot"><div class="full"><button type="submit" id="send">Enviar para revisión</button><p id="status" role="status" aria-live="polite"></p></div></form></main><iframe name="event-submission" title="Envío de evento" hidden></iframe><script type="module">
import { prepareEventImage } from "/eventos/event-image.js";
const form=document.querySelector('#form'),status=document.querySelector('#status'),send=document.querySelector('#send');let pending=null,requestId=null,preparing=false;
form.elements.entrada.addEventListener('change',()=>{const paid=form.elements.entrada.value==='Paga';document.querySelector('#price').hidden=!paid;form.elements.precio.required=paid});form.addEventListener('input',()=>{if(!pending&&!preparing)requestId=null});form.elements.imagen_archivo.addEventListener('change',()=>{if(!pending&&!preparing)requestId=null});
window.addEventListener('message',event=>{if(!pending||!/^https:\/\/(?:script\.google\.com|[a-z0-9-]+-script\.googleusercontent\.com)$/.test(event.origin))return;const result=event.data;if(!result||result.type!=='vitrina-event-submission'||result.requestId!==pending.id)return;clearTimeout(pending.timer);pending=null;send.disabled=false;status.textContent=result.message;if(result.ok){requestId=null;form.reset();document.querySelector('#price').hidden=true;form.elements.precio.required=false}});
form.addEventListener('submit',async event=>{
  event.preventDefault();
  if(pending||preparing)return;
  preparing=true;
  send.disabled=true;
  try{
    const data=Object.fromEntries(new FormData(form));
    delete data.imagen_archivo;
    const file=form.elements.imagen_archivo.files[0];
    if(data.fin<=data.inicio)throw Error('La finalización debe ser posterior al inicio.');
    for(const key of ['enlace','imagen_url']){
      if(data[key]&&!data[key].startsWith('https://'))throw Error('Los enlaces deben comenzar con https://.');
    }
    if(file&&data.imagen_url)throw Error('Elegí una foto o un enlace, no ambos.');
    status.textContent=file?'Preparando la foto…':'Enviando evento…';
    const imagen=file?await prepareEventImage(file):null;
    requestId=requestId||crypto.randomUUID();
    const transport=document.createElement('form');
    transport.method='POST';
    transport.action='https://script.google.com/macros/s/AKfycbybDC2YTJj8oqoclwREuMQxFdd8szCNZprb3WAy6gwb4fjH7KnaIdXJExqNe93yFsejiQ/exec';
    transport.target='event-submission';
    transport.hidden=true;
    const input=document.createElement('input');
    input.name='payload';
    input.value=JSON.stringify({requestId,data,imagen});
    transport.append(input);
    document.body.append(transport);
    status.textContent='Enviando evento…';
    pending={id:requestId,timer:setTimeout(()=>{pending=null;send.disabled=false;status.textContent='No recibimos confirmación. Podés reintentar sin crear otra solicitud.'},45000)};
    transport.submit();
    transport.remove();
  }catch(error){status.textContent=error.message||'No se pudo preparar la solicitud.'}
  finally{preparing=false;if(!pending)send.disabled=false}
});
</script></body></html>
