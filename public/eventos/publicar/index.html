<!doctype html><html lang="es-UY"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proponer un evento | Vitrina Cerca</title><meta name="robots" content="noindex,follow"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/eventos/eventos.css"></head><body><main><nav><a class="brand" href="/">VITRINA <strong>CERCA</strong></a><a href="/eventos/">Ver cartelera</a></nav><h1>Compartí tu evento</h1><p class="intro">Publicación gratuita por el momento. Completá los datos y Mónica los revisará antes de publicarlos. Al finalizar, el evento dejará de aparecer automáticamente.</p><form id="form"><label class="full">Título *<input name="titulo" required maxlength="100"></label><label class="full">Descripción breve *<textarea name="descripcion" required maxlength="700"></textarea></label><label>Localidad *<input name="localidad" required maxlength="80" placeholder="Ej.: Salinas"></label><label>Lugar *<input name="lugar" required maxlength="120"></label><label class="full">Dirección pública *<input name="direccion" required maxlength="160"></label><label>Inicio *<input name="inicio" type="datetime-local" required><span class="small">Fecha y hora de Uruguay.</span></label><label>Finalización *<input name="fin" type="datetime-local" required><span class="small">Si dura varios días, indicá la última fecha.</span></label><label>Entrada *<select name="entrada" required><option value="Gratis">Gratis</option><option value="Paga">Paga</option></select></label><label id="price" hidden>Costo de la entrada *<input name="precio" maxlength="100" placeholder="Ej.: $250 uruguayos"></label><label>Organizador *<input name="organizador" required maxlength="100"></label><label>Teléfono público *<input name="telefono" type="tel" required maxlength="20" placeholder="59899123456"></label><label class="full">Enlace para consultar o reservar<input name="enlace" type="url" maxlength="1000" placeholder="https://"></label><label class="full">Enlace público al cartel (opcional)<input name="imagen_url" type="url" maxlength="1000" placeholder="https://"><span class="small">Una imagen autorizada. Podés dejarlo vacío y publicaremos los datos del evento.</span></label><label class="full">Correo de contacto privado *<input name="correo" type="email" required maxlength="120"><span class="small">Solo para gestionar tu solicitud; no se publica.</span></label><label class="check full"><input type="checkbox" name="consentimiento" value="si" required><span>Confirmo que los datos son correctos y tengo autorización para publicar el contenido. Leí el <a href="/privacidad/" target="_blank" rel="noopener">aviso de privacidad</a> y autorizo el uso del correo para gestionar esta solicitud.</span></label><input name="website" tabindex="-1" autocomplete="off" aria-hidden="true" class="honeypot"><div class="full"><button type="submit" id="send">Enviar para revisión</button><p id="status" role="status" aria-live="polite"></p></div></form></main><iframe name="event-submission" title="Envío de evento" hidden></iframe><script>
const form=document.querySelector('#form'),status=document.querySelector('#status'),send=document.querySelector('#send');let pending=null,requestId=null;
form.elements.entrada.addEventListener('change',()=>{const paid=form.elements.entrada.value==='Paga';document.querySelector('#price').hidden=!paid;form.elements.precio.required=paid});form.addEventListener('input',()=>{if(!pending)requestId=null});
window.addEventListener('message',event=>{if(!pending||!/^https:\/\/(?:script\.google\.com|[a-z0-9-]+-script\.googleusercontent\.com)$/.test(event.origin))return;const result=event.data;if(!result||result.type!=='vitrina-event-submission'||result.requestId!==pending.id)return;clearTimeout(pending.timer);pending=null;send.disabled=false;status.textContent=result.message;if(result.ok){requestId=null;form.reset();document.querySelector('#price').hidden=true;form.elements.precio.required=false}});
form.addEventListener('submit',event=>{event.preventDefault();if(pending)return;const data=Object.fromEntries(new FormData(form));if(data.fin<=data.inicio){status.textContent='La finalización debe ser posterior al inicio.';return}for(const key of ['enlace','imagen_url']){if(data[key]&&!data[key].startsWith('https://')){status.textContent='Los enlaces deben comenzar con https://.';return}}requestId=requestId||crypto.randomUUID();const transport=document.createElement('form');transport.method='POST';transport.action='https://script.google.com/macros/s/AKfycbybDC2YTJj8oqoclwREuMQxFdd8szCNZprb3WAy6gwb4fjH7KnaIdXJExqNe93yFsejiQ/exec';transport.target='event-submission';transport.hidden=true;const input=document.createElement('input');input.name='payload';input.value=JSON.stringify({requestId,data});transport.append(input);document.body.append(transport);send.disabled=true;status.textContent='Enviando evento…';pending={id:requestId,timer:setTimeout(()=>{pending=null;send.disabled=false;status.textContent='No recibimos confirmación. Podés reintentar sin crear otra solicitud.'},30000)};transport.submit();transport.remove()});
</script></body></html>
